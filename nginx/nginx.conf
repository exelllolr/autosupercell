# nginx/nginx.conf — обратный прокси для AutoSupercell API
#
# Ключевая задача: увеличенные таймауты для эндпоинта /supercell/purchase,
# который может выполняться до 10 минут (браузер + авторизация + оплата).
# Стандартный таймаут nginx — 60 сек; без этого конфига запрос обрывается
# раньше, чем браузерная автоматизация успевает завершиться.
#
# Использование (docker-compose или standalone):
#   docker run -p 80:80 -v $(pwd)/nginx/nginx.conf:/etc/nginx/conf.d/default.conf nginx:alpine
#
# Или добавьте сервис nginx в docker-compose.yml:
#   nginx:
#     image: nginx:alpine
#     ports: ["80:80"]
#     volumes: ["./nginx/nginx.conf:/etc/nginx/conf.d/default.conf"]
#     depends_on: [app]
#     networks: [autosupercell-network]

upstream autosupercell_app {
    # Имя сервиса из docker-compose.yml
    server app:8000;

    # Keepalive соединения к upstream (меньше overhead на TCP-хендшейки)
    keepalive 16;
}

# ─── Глобальные таймауты для долгих запросов ─────────────────────────────────
# Эти значения применяются ко всем location, если не переопределены локально.
# 720 сек = 12 минут (REQUEST_TIMEOUT в purchase_demo.py = 600 сек = 10 мин;
# +120 сек запас на сетевые задержки).

map $request_uri $is_purchase_endpoint {
    default                         0;
    "~*/supercell/purchase"         1;
    "~*/auth/login"                 1;
    "~*/auth/verify"                1;
}

server {
    listen 80;
    server_name _;  # принимать любой хост; замените на ваш домен при необходимости

    # Максимальный размер тела запроса (скриншоты / base64 изображения)
    client_max_body_size 16M;

    # Буфер ответа — не буферизуем большие ответы (видео, скриншоты)
    proxy_buffering          off;
    proxy_request_buffering  off;

    # ─── Базовые заголовки прокси ────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # ─── Основной location: FastAPI API ──────────────────────────────────────
    location / {
        proxy_pass http://autosupercell_app;

        # Стандартные таймауты для большинства эндпоинтов (30 сек)
        proxy_connect_timeout  30s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;
    }

    # ─── Долгие эндпоинты (покупка, авторизация) ─────────────────────────────
    # REQUEST_TIMEOUT = 600 сек; nginx должен ждать дольше, чем клиент.
    location ~ ^/api/v1/(supercell/purchase|auth/(login|verify)) {
        proxy_pass http://autosupercell_app;

        proxy_connect_timeout  30s;
        # send/read timeout = 720 сек (12 мин) — больше REQUEST_TIMEOUT (10 мин)
        proxy_send_timeout     720s;
        proxy_read_timeout     720s;

        # Отключаем буферизацию ответа: клиент получает данные по мере прихода
        proxy_buffering off;
    }

    # ─── Health check (быстрый эндпоинт, отдельный таймаут) ──────────────────
    location = /api/v1/health {
        proxy_pass http://autosupercell_app;

        proxy_connect_timeout  5s;
        proxy_send_timeout     5s;
        proxy_read_timeout     5s;

        # Не кэшировать health check
        add_header Cache-Control "no-store, no-cache";
    }

    # ─── Prometheus metrics (только с localhost / внутри сети) ───────────────
    # ВАЖНО: эндпоинт /metrics не защищён паролем.
    # Раскомментируйте allow/deny, если nginx доступен снаружи.
    location = /metrics {
        proxy_pass http://autosupercell_app;

        # Разрешить только из внутренней Docker-сети (172.16.0.0/12)
        # и с самого хоста. Заблокировать всё остальное.
        # allow 172.16.0.0/12;
        # allow 127.0.0.1;
        # deny all;

        proxy_connect_timeout  5s;
        proxy_send_timeout     5s;
        proxy_read_timeout     5s;
    }

    # ─── Swagger UI / ReDoc (документация API) ───────────────────────────────
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://autosupercell_app;

        proxy_connect_timeout  10s;
        proxy_send_timeout     10s;
        proxy_read_timeout     10s;
    }

    # ─── Логи ────────────────────────────────────────────────────────────────
    # Подробный формат с временем ответа — удобно для диагностики медленных запросов.
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/autosupercell_access.log main;
    error_log  /var/log/nginx/autosupercell_error.log  warn;
}
